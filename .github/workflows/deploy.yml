name: Deploy to areg.nl/rpm-boss

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The one build that is a demo. The website is linked as "try it", and a
      # visitor has neither engine audio nor an engine: the samples give the
      # batch path something to read, and the simulated engine gives the live
      # tachometer something to show. Nothing else sets either flag — a release
      # APK, the Play bundle and a bare `npm run build` all carry neither.
      - run: npm run build
        env:
          VITE_SAMPLES: '1'
          VITE_MOCK: '1'
      - name: Upload dist over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          dangerous-clean-slate: false
